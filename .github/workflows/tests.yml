name: tests
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  unit:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Unit and CLI tests (offline, no runtime dependencies)
        env:
          PYTHONPATH: src
        run: python -m unittest discover -s tests -v
      - name: Compile source and examples
        run: python -m compileall -q src tests examples
      - name: Smoke-test installed entry point
        run: |
          python -m pip install .
          arm-workbench run --auto-confirm-simulation --output "${{ runner.temp }}/arm-workbench-runs"
